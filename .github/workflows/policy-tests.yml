name: Policy tests

on:
  push:
  pull_request:

jobs:
  policy-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run game-independent policy tests
        run: dotnet run --project KellysAIRLIFT.Tests/KellysAIRLIFT.Tests.csproj -c Release
