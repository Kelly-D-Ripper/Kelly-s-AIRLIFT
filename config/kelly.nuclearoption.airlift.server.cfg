## Dedicated-server template for Kelly's AIRLIFT 0.14.0
## Copy/rename to BepInEx/config/kelly.nuclearoption.airlift.cfg.

[Authorization]
OwnerSteamId = 0
AllowListenServerTesting = false

[Automatic]
EnableAirportCaptureAirlifts = true
AllowListenServerCaptureTesting = false
AllowValidatedDynamicZoneFallback = true
AirportCaptureCooldownSeconds = 600
OffMapSpawnMargin = 3000

[Messaging]
AnnounceMilestonesInGame = true

[CombatDrop]
Type12Mount = Aryx_MC260_Type12_x1
AfvIfvMount = 6x6_1_IFVx1
AfvAaMount = 6x6_1_AAx1
FrcvMount =
FrcvDisplayName = FRCV-105 LT
SuppressionMount = AGM-68
SuppressionRange = 8000
SuppressionRetrySeconds = 8
DropRadarAltitude = 5
DescentStartDistance = 6000
TrailSpacing = 140
MinimumRunwayLength = 1200
MinimumRunwayWidth = 25
MaximumSlopeDegrees = 2
RunwayDispersalDistance = 180

[PublicPurchase]
EnableCombatDropPurchases = true
CombatDropCost = 400
CombatDropCooldownSeconds = 300

[DropZone]
RequireRecordedZones = true
CruiseRadarAltitude = 1200
DropRadarAltitude = 450
MaximumSlopeDegrees = 7

[PostDrop]
Behavior = Return
Delay = 0
PreferredRecoveryAirbase = Maris

[Flight]
EgressTurnDegrees = 30
DropFlareBurstCount = 10
DropFlareBurstInterval = 0.5

[Lifecycle]
CleanupDeployedCargoWhenServerEmpty = true

[Diagnostics]
VerboseLogging = false
